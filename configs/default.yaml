# Default pipeline configuration. Owner: python-developer (vision/vlm keys: dl-engineer).
# Change defaults only with a note in docs/DECISIONS.md.

input:
  max_file_mb: 25
  max_pixels: 16000000        # reject larger decoded images
  allowed_formats: [PNG, JPEG, WEBP, BMP]

alignment:
  mode: auto                  # identity | auto (identity, else translation/affine with checks)
  max_shift_fraction: 0.05    # larger estimated shift -> unreliable
  min_overlap_fraction: 0.85  # below -> unreliable -> review
  min_inlier_ratio: 0.5
  min_error_gain: 0.7         # a warp is adopted only if residual < gain * identity residual

features:
  model: dinov2_vits14
  hub_repo: facebookresearch/dinov2
  input_long_side: 518        # multiple of patch size 14 after padding
  patch_size: 14
  device: auto                # auto | cuda | cpu
  dtype: float32

proposals:
  sources: [dinov2, classical]  # union, each proposal keeps its source
  dinov2_threshold: 0.35        # 1 - cosine similarity; tuned on dev split only
  classical_threshold: 40       # absolute gray diff (0-255) after blur
  min_area_fraction: 0.0001
  min_area_px: 40               # absolute floor (small objects such as coins)
  global_change_fraction: 0.10  # >=10% of valid area above dinov2 threshold -> one full-frame proposal, truncated=true (dev-tuned)
  mask_erode_px: 7              # erode valid-overlap mask before thresholding (warp border)
  box_padding_px: 8
  merge_iou: 0.1
  max_regions: 8                # cap; truncation is recorded and blocks PASS

vlm:
  provider: ollama              # ollama | mock
  model: qwen2.5vl:3b
  base_url: http://localhost:11434
  timeout_s: 75                 # CPU-resident VLM: stage-1 audit call takes ~35 s (was 30; see MODEL_NOTES)
  max_attempts: 2
  temperature: 0.0
  # prompt version lives in src/gameqa/vision/prompts.py (PROMPT_VERSION, currently v9)
  crop_max_side: 336
  context_max_side: 512
  num_ctx: 2048
  keep_alive: 30m
  audit_max_side: 512

run:
  deadline_s: 300               # end-to-end; exceeded -> NEEDS_REVIEW
  artifacts_dir: artifacts
  references_dir: references
  cache_dir: data/cache
