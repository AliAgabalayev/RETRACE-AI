[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameqa"
version = "0.1.0"
description = "Rule-aware visual regression prototype (DINOv2 proposals + VLM judgments)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pillow", "opencv-python", "pydantic>=2", "pyyaml", "httpx",
  "streamlit", "pandas", "pyarrow", "huggingface_hub", "torch", "torchvision",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gameqa = "gameqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_model: needs real DINOv2 weights and a running VLM (run with GAMEQA_REAL=1)",
]
